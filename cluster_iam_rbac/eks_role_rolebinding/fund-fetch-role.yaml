# EKS Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: fund-fetch-ns
  name: fund-fetch-role
rules:
  - apiGroups: [""] # "" indicates the core API group
    resources: ["pods"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fund-fetch-rolebinding
  namespace: fund-fetch-ns
subjects:
  - kind: Group
    name: fund-fetchers-svc
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: fund-fetch-role
  apiGroup: rbac.authorization.k8s.io
