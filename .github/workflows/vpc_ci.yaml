name: "VPC CI"

on:
    push:
        paths:
            - "platform_engineering/vpc/**.tf"
            - ".github/workflows/**"
    pull_request:
    branches:
        - main
    paths:
        - "platform_engineering/vpc/**.tf"
        - ".github/workflows/**"
    workflow_dispatch:

    permissions:
        contents: read
        id-token: write
        pull-requests: write

    jobs:
        terraform-plan:
            name: "Terraform Plan"
            runs-on: ubuntu-latest

            env:
                AWS_REGION: us-east-1
                TF_LOG: INFO

            steps:
                - name: Checkout code
                  uses: actions/checkout@v3

                - name: "AWS creds - OIDC"
                  uses: aws-actions/configure-aws-credentials@v4
                  with:
                      role-to-assume: arn:aws:iam::514005485562:role/GitHubActionsTerraformRole
                      aws-region: ${{ env.AWS_REGION }}

                - name: "Setup Terraform"
                  uses: hashicorp/setup-terraform@v3
                  with:
                      terraform_version: "1.11.0"

                - name: Terraform Init
                  run: terraform init

                - name: Terraform Plan
                  run: terraform plan

                - name: "terraform plan upload"
                  uses: actions/upload-artifact@v4
                  with:
                      name: tfplan
                      path: tfplan
                      retention-days: 1

    terraform-apply:
        name: "Terraform Apply"
        runs-on: ubuntu-latest
        needs: terraform-plan
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        environment: production

        env:
            AWS_REGION: "us-east-1"
            TF_LOG: INFO

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: "AWS creds - OIDC"
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::514005485562:role/GitHubActionsTerraformRole
                  aws-region: ${{ env.AWS_REGION }}

            - name: "Setup Terraform"
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "1.11.0"

            - name: "Download Terraform Plan"
              uses: actions/download-artifact@v4
              with:
                  name: tfplan

            - name: "Terraform init"
              id: init
              run: terraform init

            - name: "Terraform Apply"
              run: terraform apply -input=false -no-color tfplan
