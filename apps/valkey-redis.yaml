apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://valkey.io/valkey-helm
    chart: valkey
    targetRevision: 0.11.0

    helm:
      valuesObject:
        # No persistent volume
        dataStorage:
          enabled: false

        # Valkey configuration
        valkeyConfig: |
          maxmemory 1gb
          maxmemory-policy allkeys-lru

        auth:
          enabled: true
          usersExistingSecret: valkey-default

        aclUsers:
          default:
            permissions: "~* &* +@all"
            passwordKey: default

        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "1.5Gi"

  destination:
    server: https://kubernetes.default.svc
    namespace: valkey

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
